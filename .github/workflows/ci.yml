name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install Qt loader libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libpulse0
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12
      - run: uv run python -m unittest discover -s tests -v
      - name: Check Windows vision resolves CUDA PyTorch
        if: runner.os == 'Linux'
        run: uv tree --frozen --python-platform windows | grep -F 'torch v2.14.0+cu130'
