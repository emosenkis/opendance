[[url_helpers]]
# Let yt-dlp's current extractor set decide which sites are supported instead
# of baking a domain list into OpenDance that immediately becomes stale.
domains = ["*"]
command = ["yt-dlp", "--no-playlist", "--no-progress", "-f", "bestvideo[ext=mp4][vcodec^=vp09]+bestaudio[ext=m4a]/best", "--paths", "{DOWNLOAD_DIR}", "--print", "after_move:filepath", "--", "{URL}"]
